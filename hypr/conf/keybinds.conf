# variables
$mainMod = SUPER # default modifier being "Windowshit" key
$terminal = kitty
env = browser,firefox
env = menu,wofi --show drun
env = max_volume,3
env = code,code
env = fileManager,yazi

# locking
bindl = ,switch:on:Lid Switch, exec, hyprlock --immediate

# launch apps
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, forcekillactive
bind = $mainMod, Q, exec, ~/.config/hypr/scripts/workspace_remove.sh
bind = $mainMod, W, exec, $browser
bind = $mainMod, M, exec, $menu
bind = $mainMod, R, exec, hyprctl reload
bind = $mainMod, R, exec, killall waybar && waybar &
bind = $mainMod, C, exec, $code
bind = $mainMod, F, exec, $terminal -e $fileManager
#bind = $mainMod, F, exec, $fileManager #if manager is standalone

bind = $mainMod, L, exec, hyprlock
bind = $mainMod, V, exec, cliphist list | wofi --dmenu --pre-display-cmd "echo '%s' | cut -f 2" | cliphist decode | wl-copy

# screenshot
bind = $mainMod, P, exec, hyprshot -m output
bind = $mainMod+SHIFT, P, exec, hyprshot -m region
bind = $mainMod+CTRL, P, exec, hyprshot -m window

# gestures
gesture = 4, horizontal, workspace

# windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod ALT, SPACE, togglefloating
bind = $mainMod, SPACE, fullscreen

# laptop settings
# Audio (PulseAudio)
bindel = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = ,XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# workspaces switching
bindl = $mainMod ALT, 1, movetoworkspacesilent, 1
bindl = $mainMod ALT, 2, movetoworkspacesilent, 2
bindl = $mainMod ALT, 3, movetoworkspacesilent, 3
bindl = $mainMod ALT, 4, movetoworkspacesilent, 4
bindl = $mainMod ALT, 5, movetoworkspacesilent, 5
bindl = $mainMod ALT, 6, movetoworkspacesilent, 6
bindl = $mainMod ALT, 7, movetoworkspacesilent, 7
bindl = $mainMod ALT, 8, movetoworkspacesilent, 8
bindl = $mainMod ALT, 9, movetoworkspacesilent, 9
bindl = $mainMod ALT, 0, movetoworkspacesilent, 10

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
